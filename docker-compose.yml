# Legacy Compose project-id is pinned only to preserve the existing named volume
# when the source directory is renamed. Runtime service/container use the new name.
name: account-provisioner

services:
  employee-offboarding-manager:
    build:
      context: .
    container_name: employee-offboarding-manager
    restart: unless-stopped

    environment:
      APP_NAME: "${APP_NAME:-Управление жизненным циклом учетных записей}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:-change-me-to-a-long-random-secret}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8081}"
      APP_TIMEZONE: "Europe/Moscow"
      TZ: "Europe/Moscow"
      DATABASE_URL: "sqlite:///./data/app.db"

      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-lax}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-employee_offboarding_manager_session}"

      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMeNow!123}"

      AUTH_MODE: "${AUTH_MODE:-local}"
      AD_LOGIN_ENABLED: "${AD_LOGIN_ENABLED:-false}"
      AD_ALLOWED_GROUP_DN: "${AD_ALLOWED_GROUP_DN:-}"

      AD_CHECK_ENABLED: "${AD_CHECK_ENABLED:-true}"
      AD_SERVER: "${AD_SERVER:-}"
      AD_PORT: "${AD_PORT:-636}"
      AD_USE_SSL: "${AD_USE_SSL:-true}"
      AD_VERIFY_TLS: "${AD_VERIFY_TLS:-true}"
      AD_CA_CERT_FILE: "${AD_CA_CERT_FILE:-}"
      AD_DOMAIN: "${AD_DOMAIN:-}"
      AD_BASE_DN: "${AD_BASE_DN:-}"
      AD_USERS_OU: "${AD_USERS_OU:-}"
      AD_BIND_DN: "${AD_BIND_DN:-}"
      AD_BIND_PASSWORD: "${AD_BIND_PASSWORD:-}"
      AD_UPN_SUFFIX: "${AD_UPN_SUFFIX:-}"
      AD_FORCE_CHANGE_AT_FIRST_LOGON: "${AD_FORCE_CHANGE_AT_FIRST_LOGON:-false}"
      AD_PASSWORD_NEVER_EXPIRES: "${AD_PASSWORD_NEVER_EXPIRES:-true}"
      AD_DEFAULT_GROUP_DNS: "${AD_DEFAULT_GROUP_DNS:-}"

      ZIMBRA_CHECK_ENABLED: "${ZIMBRA_CHECK_ENABLED:-false}"
      ZIMBRA_BACKEND: "${ZIMBRA_BACKEND:-ssh_zmprov}"
      ZIMBRA_SSH_HOST: "${ZIMBRA_SSH_HOST:-}"
      ZIMBRA_SSH_PORT: "${ZIMBRA_SSH_PORT:-22}"
      ZIMBRA_SSH_USER: "${ZIMBRA_SSH_USER:-provisioner}"
      ZIMBRA_SSH_AUTH: "${ZIMBRA_SSH_AUTH:-key}"
      ZIMBRA_SSH_PRIVATE_KEY: "${ZIMBRA_SSH_PRIVATE_KEY:-/run/secrets/zimbra_ssh_key}"
      ZIMBRA_SSH_PASSWORD: "${ZIMBRA_SSH_PASSWORD:-}"
      ZIMBRA_SSH_PASSWORD_FILE: "${ZIMBRA_SSH_PASSWORD_FILE:-}"
      ZIMBRA_SSH_KNOWN_HOSTS: "${ZIMBRA_SSH_KNOWN_HOSTS:-/app/known_hosts}"
      ZIMBRA_DOMAINS: "${ZIMBRA_DOMAINS:-example.ru,example.com}"
      ZIMBRA_DOMAIN_MODE: "${ZIMBRA_DOMAIN_MODE:-separate}"
      ZIMBRA_PRIMARY_DOMAIN: "${ZIMBRA_PRIMARY_DOMAIN:-example.ru}"
      ZIMBRA_CREATE_ALIASES: "${ZIMBRA_CREATE_ALIASES:-true}"
      ZIMBRA_COS_ID: "${ZIMBRA_COS_ID:-}"

      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      SMTP_SSL: "${SMTP_SSL:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-20}"
      SMTP_RETRY_ATTEMPTS: "${SMTP_RETRY_ATTEMPTS:-3}"
      SMTP_RETRY_DELAY_SECONDS: "${SMTP_RETRY_DELAY_SECONDS:-2}"

      ITINVENT_ENABLED: "${ITINVENT_ENABLED:-false}"
      ITINVENT_DB_HOST: "${ITINVENT_DB_HOST:-}"
      ITINVENT_DB_PORT: "${ITINVENT_DB_PORT:-1433}"
      ITINVENT_DB_NAME: "${ITINVENT_DB_NAME:-ITInvent}"
      ITINVENT_DB_USERNAME: "${ITINVENT_DB_USERNAME:-}"
      ITINVENT_DB_PASSWORD: "${ITINVENT_DB_PASSWORD:-}"
      ITINVENT_CONNECT_TIMEOUT_SECONDS: "${ITINVENT_CONNECT_TIMEOUT_SECONDS:-5}"
      ITINVENT_QUERY_TIMEOUT_SECONDS: "${ITINVENT_QUERY_TIMEOUT_SECONDS:-10}"
      ITINVENT_ISSUED_LOCATION_NO: "${ITINVENT_ISSUED_LOCATION_NO:-24}"

      ONEC_IMAP_HOST: "${ONEC_IMAP_HOST:-}"
      ONEC_IMAP_PORT: "${ONEC_IMAP_PORT:-993}"
      ONEC_IMAP_SSL: "${ONEC_IMAP_SSL:-true}"
      ONEC_IMAP_USERNAME: "${ONEC_IMAP_USERNAME:-}"
      ONEC_IMAP_PASSWORD: "${ONEC_IMAP_PASSWORD:-}"
      ONEC_IMAP_FOLDER: "${ONEC_IMAP_FOLDER:-INBOX}"
      ONEC_IMAP_FROM_CONTAINS: "${ONEC_IMAP_FROM_CONTAINS:-1c-robot@}"
      ONEC_IMAP_LOOKBACK_DAYS: "${ONEC_IMAP_LOOKBACK_DAYS:-3}"
      ONEC_ATTACHMENT_FILENAME: "${ONEC_ATTACHMENT_FILENAME:-Штатные сотрудники - Телефонный справочник2 (XLSX).xlsx}"
      ONEC_HEADER_SEARCH_ROWS: "${ONEC_HEADER_SEARCH_ROWS:-20}"
      ONEC_DATA_DIR: "${ONEC_DATA_DIR:-/app/data/onec}"
      ONEC_SOURCE_DOMAIN: "${ONEC_SOURCE_DOMAIN:-}"
      ONEC_AUTO_IMPORT_ENABLED: "${ONEC_AUTO_IMPORT_ENABLED:-true}"
      ONEC_AUTO_IMPORT_TIME: "${ONEC_AUTO_IMPORT_TIME:-09:00}"
      ONEC_AUTO_IMPORT_STARTUP_CATCHUP: "${ONEC_AUTO_IMPORT_STARTUP_CATCHUP:-true}"
      ONEC_WORKER_HASH_SECRET: "${ONEC_WORKER_HASH_SECRET:-}"

      MAIL_PASSWORD_LENGTH: "${MAIL_PASSWORD_LENGTH:-16}"
      MAIL_PASSWORD_SPECIALS: "${MAIL_PASSWORD_SPECIALS:-!@#$%&?}"
      AD_PASSWORD_MIN_LENGTH: "${AD_PASSWORD_MIN_LENGTH:-8}"
      AD_PASSWORD_MAX_LENGTH: "${AD_PASSWORD_MAX_LENGTH:-12}"
      AD_PASSWORD_SPECIALS: "${AD_PASSWORD_SPECIALS:-!@#$%&?}"
      ROLLBACK_AD_ON_ZIMBRA_FAILURE: "${ROLLBACK_AD_ON_ZIMBRA_FAILURE:-false}"

    volumes:
      - account-provisioner-data:/app/data
      - /opt/account-provisioner/certs:/app/certs:ro
      - /opt/account-provisioner/ssh/known_hosts:/app/known_hosts:ro

    ports:
      - "0.0.0.0:${APP_PORT:-8081}:8000"

    networks:
      - default
      - telegram-egress

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  telegram-egress:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:8086:506:2::/64

volumes:
  # Legacy volume identifier is intentionally retained so the existing
  # SQLite database is not replaced by an empty volume during rename.
  account-provisioner-data:
