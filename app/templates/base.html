<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Управление учетными записями{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/navigation.css">
  {% if user %}
  <link rel="stylesheet" href="/static/zimbra_observer.css">
  <script src="/static/zimbra_observer.js" defer></script>
  {% endif %}
  {% if user and user.role == 'admin' %}
  <link rel="stylesheet" href="/static/telegram_settings.css">
  <link rel="stylesheet" href="/static/onec_sources.css">
  <script src="/static/settings_extensions.js" defer></script>
  {% endif %}
  <link rel="stylesheet" href="/static/layout.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Управление учетными записями</div>
      {% if user %}
      <nav class="topnav">
        <div class="nav-main">
          <a href="/">Журнал</a>
          <a href="/employees/new">Создание</a>
          <a href="/blocking">Блокировка</a>
        </div>

        <div class="nav-tools">
          {% if user.role == 'admin' %}
          <a class="settings-link" href="/settings">Настройки</a>
          {% endif %}
          <form method="post" action="/logout" class="inline">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="link-button" type="submit">
              Выйти: {{ user.username }}
              {% if user.role == 'admin' %}<span class="nav-role">администратор</span>{% endif %}
            </button>
          </form>
        </div>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
